name: output-build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  print:
    outputs:
      PRINT_ME: Test
    name: print
    runs-on: ubuntu-latest
    steps:
      - run: env | sort

  print-outputs:
    name: print output from "print" step
    needs: print
    runs-on: ubuntu-latest
    steps:
      - run: echo "hello output $PRINT_ME"


