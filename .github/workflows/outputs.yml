name: output-build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  print:
    name: print
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hello world"

  print-outputs:
    needs: print output from "print" step
    runs-on: ubuntu-latest
    steps:
      - run: echo "hello output"


