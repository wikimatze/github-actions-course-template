name: Auto Labeler

on:
  pull_request:
    types: [opened]

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Apply Label
        uses: HassanBahati/labeler-action@v1.0
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          label: "pull-request"
