name: GIPHY Generator

on:
  pull_request:
    types: [opened, edited]

permissions:
  contents: read

jobs:
  giphy-generator:
    name: GIPHY Generator
    runs-on: ubuntu-latest
    steps:
      - name: GIPHY Generator
        if: >-
          (github.event_name == 'issues' &&
           github.event.issue.body != null) ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.body != null) ||
          (github.event_name == 'issue_comment' &&
           github.event.comment.body != null)
        id: giphy_generator
        uses: iamhughes/giphy-generator@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
          GIPHY_TOKEN: ${{ secrets.GIPHY_TOKEN }} # This token should be created on giphy.com: https://developers.giphy.com/dashboard/?create=true
        with:
          rating: 'g'
          lang: 'en'
